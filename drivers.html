<body>

<h1 class="page-title">2025 Drivers</h1>
 <div class="red-divider"></div>

<section class="drivers-section">

  <div class="drivers-row">

  <div class="driver-card mclaren">
    <div class="driver-img">
      <img src="images/Oscar Piastri.png">
    </div>
    <div class="driver-name">
      <span class="first">Oscar</span>
      <span class="last">Piastri</span>
    </div>
  </div>

  <div class="driver-card mclaren">
    <div class="driver-img">
      <img src="images/Lando Norris.png">
    </div>
    <div class="driver-name">
      <span class="first">Lando</span>
      <span class="last">Norris</span>
    </div>
  </div>

  <div class="driver-card mercedes">
    <div class="driver-img">
      <img src="images/George Rusell.png">
    </div>
    <div class="driver-name">
      <span class="first">George</span>
      <span class="last">Rusell</span>
    </div>
  </div>

  <div class="driver-card mercedes">
    <div class="driver-img">
      <img src="images/Kimi Antonelli.png">
    </div>
    <div class="driver-name">
      <span class="first">Kimi</span>
      <span class="last">Antonelli</span>
    </div>
  </div>

  <div class="driver-card redbull">
    <div class="driver-img">
      <img src="images/Max Verstappen.png">
    </div>
    <div class="driver-name">
      <span class="first">Max</span>
      <span class="last">Verstappen</span>
    </div>
  </div>

  <div class="driver-card redbull">

      <img src="images/Yuki Tsunoda.png" alt="Yuki Tsunoda">
    </div>
    <div class="driver-name">
      <span>Yuki</span>
      <strong>Tsunoda</strong>
    </div>
  </div>

  <div class="driver-card ferrari">
    <div class="driver-img">
      <img src="images/Charles Leclerc.png" alt="Charles Leclerc">
    </div>
    <div class="driver-name">
      <span>Charles</span>
      <strong>Leclerc</strong>
    </div>
  </div>
  </div>   
</section>
